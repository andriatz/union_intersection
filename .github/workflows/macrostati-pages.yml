name: Deploy MacroStati (sottocartella macrostati/) su GitHub Pages

on:
  push:
    branches: [vibe/macrostati-dbbdcc, master]
    paths:
      - 'macrostati/**'
      - '.github/workflows/macrostati-pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: macrostati-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test macrostati/tests/engine.test.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./macrostati
      - id: deployment
        uses: actions/deploy-pages@v4
